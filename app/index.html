<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cartea Tehnică · santier-log</title>
<style>
  /* Layout: bară sus cu firma; stânga lucrările; dreapta Cartea Tehnică a lucrării alese, pe secțiuni ca dosarul fizic. */
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1f1e1b; --muted: #6b6a66; --faint: #9a988f;
    --line: #e4e2dc; --hover: #f0eee9; --accent: #c2410c; --accent-soft: #fdebe1;
    --ok: #15803d; --ok-soft: #e3f3e8; --wip: #78766f; --wip-soft: #efede8;
    --warn: #a16207; --warn-soft: #fbf1d9;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #f1f0ec; --muted: #a3a29c; --faint: #75746e;
      --line: #34332f; --hover: #282824; --accent: #f97316; --accent-soft: #3a2519;
      --ok: #4ade80; --ok-soft: #1c2f22; --wip: #a3a29c; --wip-soft: #2a2a26;
      --warn: #facc15; --warn-soft: #33290f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  .brand { font-weight: 700; color: var(--accent); }
  .card h1 { font-size: 1.3rem; margin: 6px 0 8px; }
  .card p { color: var(--muted); margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; padding: 11px 12px; font: inherit; font-size: 16px; /* sub 16px, iPhone face zoom în câmp */ color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; margin-top: 12px; }
  .eroare { color: var(--accent); margin-top: 12px; }

  /* Aplicația */
  .bara {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; display: flex; align-items: center; gap: 12px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .bara .firma { font-weight: 600; }
  .bara .sep { color: var(--faint); }
  .bara .dreapta { margin-left: auto; display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 13px; }
  .bara .dreapta button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }

  .app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 50px); }
  aside { border-right: 1px solid var(--line); padding: 16px 10px; background: var(--panel); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 0 6px 8px; font-weight: 600; }
  .lucrare-btn { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
  .lucrare-btn:hover { background: var(--hover); }
  .lucrare-btn[aria-current="true"] { background: var(--accent-soft); }
  .lucrare-btn strong { display: block; font-weight: 600; }
  .lucrare-btn span { color: var(--muted); font-size: 13px; }

  main { min-width: 0; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
  .continut { max-width: 920px; margin: 0 auto; display: grid; gap: 22px; }

  .antet h1 { font-size: clamp(22px, 4vw, 30px); margin: 0 0 6px; text-wrap: balance; }
  .antet dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 4px 20px; margin: 0; font-size: 14px; }
  .antet dt { color: var(--muted); font-size: 12px; }
  .antet dd { margin: 0 0 6px; }
  .persoane { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .persoane span { font-size: 12px; background: var(--hover); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }

  .progres { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
  .progres .rand { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; }
  .bara-progres { height: 8px; border-radius: 99px; background: var(--wip-soft); overflow: hidden; }
  .bara-progres i { display: block; height: 100%; background: var(--ok); }
  .legenda { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }

  section.grup h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
  section.grup h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); }
  .lista { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tip { border-top: 1px solid var(--line); }
  .tip:first-child { border-top: 0; }
  .tip-cap { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; width: 100%; text-align: left; background: none; border: 0; }
  .tip-cap[aria-expanded] { cursor: pointer; }
  .tip-cap[aria-expanded]:hover { background: var(--hover); }
  .cod { font: 12px var(--mono); color: var(--faint); }
  .nume { min-width: 0; }
  .nume small { display: block; color: var(--muted); font-size: 12px; }
  .tip.wip .nume { color: var(--muted); }
  .eticheta { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .eticheta.ok { color: var(--ok); background: var(--ok-soft); }
  .eticheta.wip { color: var(--wip); background: var(--wip-soft); font-weight: 500; }

  .docs { padding: 4px 14px 14px 78px; display: grid; gap: 8px; }
  .docs .gol { color: var(--muted); font-size: 14px; }
  .docs .sfat { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .docs .sfat q { color: var(--ink); }
  .tabel { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; }
  td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .stare { font-size: 12px; border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .stare.ciorna { background: var(--warn-soft); color: var(--warn); }
  .stare.emis { background: var(--ok-soft); color: var(--ok); }
  .stare.semnat { background: var(--accent-soft); color: var(--accent); }
  .stare.anulat { background: var(--wip-soft); color: var(--wip); text-decoration: line-through; }
  .semnat-gol { color: var(--faint); }
  a.eticheta, a.descarca.leg { text-decoration: none; display: inline-block; }
  a.descarca.leg { color: var(--accent); border-color: var(--accent); }
  .descarca { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .descarca:hover { border-color: var(--accent); color: var(--accent); }

  .obiect { display: grid; gap: 12px; }

  /* Vederea unui document, deschisă din codul QR. */
  .app.doc-vedere { grid-template-columns: 1fr; }
  .app.doc-vedere aside { display: none; }
  .app.doc-vedere .continut { max-width: 640px; gap: 14px; }
  .inapoi { margin: 0; }
  .inapoi a { color: var(--muted); text-decoration: none; display: inline-block; padding: 8px 0; }
  .doc-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .doc-card h1 { font-size: clamp(20px, 5vw, 26px); margin: 2px 0 8px; text-wrap: balance; }
  .doc-card h2 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .doc-card h3 { font-size: 13px; color: var(--muted); margin: 14px 0 4px; font-weight: 600; }
  .doc-card p { margin: 0 0 6px; }
  .doc-card ul { margin: 0; padding-left: 1.2em; }
  .doc-tip { color: var(--accent); font-size: 13px; font-weight: 600; }
  .doc-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .fise { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 16px; margin: 0; }
  .fise dt { color: var(--muted); font-size: 12px; }
  .fise dd { margin: 0; }
  .pasi { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 4px; }
  .incarca {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; margin: 0; cursor: pointer;
    border-radius: 10px; border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .incarca:hover { filter: brightness(0.97); }
  .incarca.ocupat { opacity: .6; pointer-events: none; }
  #fisiere-semnat:focus-visible + .stare-incarcare, .incarca:focus-within { outline: 2px solid var(--accent); }
  .stare-incarcare { margin: 8px 0 0; color: var(--muted); font-size: 14px; min-height: 1.2em; }
  .stare-incarcare.eroare { color: var(--accent); }
  .doc-card ul.fisiere { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
  .fisiere li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .fisier-nume { min-width: 0; overflow-wrap: anywhere; }
  .fisier-nume small { display: block; color: var(--muted); font-size: 12px; }
  .doc-card .descarca { min-height: 44px; padding: 8px 18px; font-size: 15px; }

  /* Grupuri „în lucru”, strânse implicit. */
  .grupuri-wip { display: grid; gap: 8px; }
  details.grup-wip { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  details.grup-wip > summary {
    list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center;
    padding: 12px 14px; min-height: 48px;
  }
  details.grup-wip > summary::-webkit-details-marker { display: none; }
  details.grup-wip > summary::after { content: "›"; color: var(--faint); font-size: 20px; line-height: 1; transition: transform .15s; }
  details.grup-wip[open] > summary::after { transform: rotate(90deg); }
  details.grup-wip > summary:hover { background: var(--hover); }
  details.grup-wip > summary .nume small { display: block; color: var(--muted); font-size: 12px; }
  details.grup-wip .lista { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
  @media (prefers-reduced-motion: reduce) { details.grup-wip > summary::after { transition: none; } }
  .obiect > h3 { margin: 0; font-size: 16px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 0; }
    aside h2 { display: none; }
    #lucrari {
      display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity;
      padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    }
    .lucrare-btn { width: auto; flex: 0 0 auto; max-width: 75vw; scroll-snap-align: start; border: 1px solid var(--line); }
    .lucrare-btn strong, .lucrare-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tip-cap { grid-template-columns: 44px minmax(0, 1fr) auto; min-height: 52px; }
    .docs { padding: 4px 12px 12px; }
    .bara .email { display: none; }
    .bara .dreapta button { min-height: 40px; padding: 6px 14px; }

    /* Tabelele devin carduri: fiecare rând e un card, fiecare celulă „Etichetă … valoare”. */
    .tabel { overflow: visible; }
    .tabel table, .tabel tbody, .tabel tr, .tabel td { display: block; width: 100%; }
    .tabel thead { display: none; }
    .tabel tr {
      display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px;
      border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; margin-bottom: 8px; background: var(--panel);
    }
    .tabel td { display: flex; flex-direction: column; justify-content: center; gap: 2px; border: 0; padding: 6px 0; min-height: 36px; width: auto; }
    .tabel td::before { content: attr(data-label); color: var(--muted); font-size: 12px; flex: 0 0 auto; }
    .tabel td > * { align-self: flex-start; }
    .tabel td.lat { display: block; grid-column: 1 / -1; }
    .tabel td.lat::before { display: block; margin-bottom: 2px; }
    .tabel td.titlu-card { font-weight: 600; }
    .descarca { min-height: 40px; padding: 6px 14px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="login" id="ecran-login" hidden>
  <div class="card">
    <div class="brand">santier-log</div>
    <section id="pas-email">
      <h1>Intră în cont</h1>
      <p>Îți trimitem pe email un cod de 6 cifre.</p>
      <form id="form-email">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required>
        <button class="btn" type="submit">Trimite codul</button>
      </form>
    </section>
    <section id="pas-cod" hidden>
      <h1>Verifică emailul</h1>
      <p>Am trimis codul la <strong id="email-afisat"></strong>.</p>
      <form id="form-cod">
        <label for="cod">Codul din email</label>
        <input id="cod" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required>
        <button class="btn" type="submit">Intră</button>
      </form>
      <button class="link" id="alt-email" type="button">Folosește alt email</button>
    </section>
    <p class="eroare" id="eroare-login" role="alert" hidden></p>
  </div>
</div>

<div id="ecran-app" hidden>

  let selectata = null

  // ---------- Login ----------
  let emailCurent = ''
  function eroareLogin(t) { $('eroare-login').textContent = t || ''; $('eroare-login').hidden = !t }
  $('form-email').addEventListener('submit', async (ev) => {
    ev.preventDefault(); const b = ev.submitter; b.disabled = true; eroareLogin('')
    emailCurent = $('email').value.trim()
    const { error } = await supabase.auth.signInWithOtp({ email: emailCurent, options: { shouldCreateUser: false } })
    b.disabled = false
    if (error) return eroareLogin(error.status === 422 || /not allowed|signups/i.test(error.message)
      ? 'Adresa asta nu are cont în santier-log.' : error.message)
    $('email-afisat').textContent = emailCurent; $('pas-email').hidden = true; $('pas-cod').hidden = false; $('cod').focus()
  })
  $('form-cod').addEventListener('submit', async (ev) => {
    ev.preventDefault(); const b = ev.submitter; b.disabled = true; eroareLogin('')
    const { error } = await supabase.auth.verifyOtp({ email: emailCurent, token: $('cod').value.trim(), type: 'email' })
    b.disabled = false
    if (error) return eroareLogin('Codul nu e bun sau a expirat.')
    porneste()
  })
  $('alt-email').addEventListener('click', () => { $('pas-cod').hidden = true; $('pas-email').hidden = false; eroareLogin('') })
  $('iesire').addEventListener('click', async () => { await supabase.auth.signOut(); location.reload() })

  // ---------- Date ----------
  async function porneste() {
    const { data: { user } } = await supabase.auth.getUser()
    if (!user) { $('ecran-login').hidden = false; $('ecran-app').hidden = true; return }
    $('ecran-login').hidden = true; $('ecran-app').hidden = false
    $('utilizator').textContent = user.email

    const [{ data: membri }, { data: lc, error }] = await Promise.all([
      supabase.from('membri').select('rol, firme ( nume )').eq('user_id', user.id),
      supabase.from('lucrari').select('id, nume, antreprenor, beneficiar, santier_obiectiv, tip, obiecte ( id, cod, nume, text_antet, ordine ), persoane_lucrare ( rol, nume, specialitate, ordine )').order('modificat_la', { ascending: false }),
    ])
    $('firma').textContent = (membri ?? []).map((m) => m.firme?.nume).filter(Boolean).join(', ') || '—'
    if (error) { $('pagina').innerHTML = `<p class="eroare">${esc(error.message)}</p>`; return }
    lucrari = lc ?? []
    deseneazaLucrari()
    const codDocument = new URLSearchParams(location.search).get('d')
    if (codDocument) return deseneazaDocument(codDocument)
    const dinAdresa = location.hash.slice(1)
    alege(lucrari.find((l) => l.id === dinAdresa)?.id ?? lucrari[0]?.id)
  }

  function deseneazaLucrari() {
    $('lucrari').innerHTML = lucrari.length
      ? lucrari.map((l) => `<button class="lucrare-btn" data-id="${l.id}"><strong>${esc(l.nume)}</strong><span>${esc(l.beneficiar || l.santier_obiectiv || '')}</span></button>`).join('')
      : '<p style="color:var(--muted);padding:0 6px">Nicio lucrare încă. Creeaz-o din Claude.</p>'
  }
  $('lucrari').addEventListener('click', (ev) => { const b = ev.target.closest('.lucrare-btn'); if (b) alege(b.dataset.id) })

  async function alege(id) {
    selectata = lucrari.find((l) => l.id === id)
    for (const b of document.querySelectorAll('.lucrare-btn')) b.setAttribute('aria-current', String(b.dataset.id === id))
    if (!selectata) { $('pagina').innerHTML = '<p style="color:var(--muted)">Nicio lucrare. Creeaz-o din Claude: <q>Creează lucrarea …</q></p>'; return }
    history.replaceState(null, '', '#' + id)
    $('pagina').innerHTML = '<p style="color:var(--muted)">Se încarcă documentele…</p>'
    const [{ data: zile }, { data: docs }] = await Promise.all([
      supabase.from('jurnal_zile').select('id, data, nr, stare, versiune, fisier_docx, fisiere_semnate').eq('lucrare_id', id).order('data', { ascending: false }),
      supabase.from('documente').select('id, obiect_id, tip, data_doc, stare, nr_pv, pozitie, versiune, categorie, descriere, fisier_docx, fisiere_semnate').eq('lucrare_id', id),
    ])
    deseneazaLucrarea(selectata, zile ?? [], docs ?? [])
  }

  // ---------- Randare ----------
  const eticheta = (activ) => activ ? '<span class="eticheta ok">Disponibil</span>' : '<span class="eticheta wip">În lucru</span>'
  const stare = (s) => `<span class="stare ${s}">${STARI[s] ?? s}</span>`
  const descarca = (cale) => cale ? `<button class="descarca" data-cale="${esc(cale)}">Word ↓</button>` : ''
  // Codul din QR, ca linkurile din tabel să ducă la aceeași pagină a documentului (vezi functions/mcp/tools/qr.ts).
  function codPentru(fel, uuid) {
    const hex = uuid.replace(/-/g, '')
    const bin = String.fromCharCode(...hex.match(/../g).map((h) => parseInt(h, 16)))
    return `${fel}.${btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`
  }
  // Varianta semnată: link spre pagina documentului, unde se vede sau se încarcă scanul.
  const semnat = (fel) => (d) => {
    if (d.stare === 'ciorna' || d.stare === 'anulat') return '<span class="semnat-gol">—</span>'
    const n = (d.fisiere_semnate ?? []).length
    const href = `?d=${codPentru(fel, d.id)}`
    return n
      ? `<a class="eticheta ok" href="${href}">Semnat · ${n} ${n === 1 ? 'fișier' : 'fișiere'}</a>`
      : `<a class="descarca leg" href="${href}">Încarcă scan</a>`
  }
  const SFAT_SEMNAT = '<p class="sfat">Varianta semnată: tipărești documentul, îl semnezi, scanezi codul QR de pe el (sau apeși „Încarcă scan”) și încarci pozele.</p>'

  function rand({ cod, nume, desc }, { activ = false, numar, corp } = {}) {
    const deschis = activ && corp != null
    return `<div class="tip ${activ ? '' : 'wip'}">
      <button class="tip-cap" ${deschis ? 'aria-expanded="false"' : 'disabled'}>
        <span class="cod">${esc(cod ?? '')}</span>
        <span class="nume">${esc(nume)}${desc ? `<small>${esc(desc)}</small>` : ''}${activ && numar != null ? `<small>${numar} ${numar === 1 ? 'document' : 'documente'}</small>` : ''}</span>
        ${eticheta(activ)}
      </button>
      ${deschis ? `<div class="docs" hidden>${corp}</div>` : ''}
    </div>`
  }

  // Tabel care pe telefon devine carduri: fiecare celulă își poartă eticheta în data-label.
  // coloane: [titlu, (rând) => html, clasă opțională]
  function tabel(coloane, randuri) {
    return `<div class="tabel"><table><thead><tr>${coloane.map(([t]) => `<th>${t}</th>`).join('')}</tr></thead><tbody>${
      randuri.map((r) => `<tr>${coloane.map(([t, f, cls]) => `<td data-label="${t}"${cls ? ` class="${cls}"` : ''}>${f(r)}</td>`).join('')}</tr>`).join('')
    }</tbody></table></div>`
  }
  const colStare = ['Stare', (d) => stare(d.stare)]
  const colGenerat = ['Generat', (d) => descarca(d.fisier_docx) || '<span class="semnat-gol">—</span>']

  function corpJurnal(zile) {
    const t = zile.length ? tabel([
      ['Nr.', (z) => z.nr, 'titlu-card'], ['Data', (z) => dataRo(z.data), 'titlu-card'], colStare,
      ['Versiune', (z) => z.versiune || '—'], colGenerat, ['Semnat', semnat('j')],
    ], zile) : '<p class="gol">Nicio zi încă.</p>'
    return t + `<p class="sfat">${SFATURI.jurnal}</p>` + SFAT_SEMNAT
  }

  function corpPv(lista, tip) {
    const t = lista.length ? tabel([
      ['Nr. PV', (d) => d.nr_pv ?? '—', 'titlu-card'], ['Data', (d) => dataRo(d.data_doc), 'titlu-card'],
      ['Descriere', (d) => esc(d.descriere || ''), 'lat'], colStare, colGenerat, ['Semnat', semnat('p')],
    ], lista) : '<p class="gol">Niciun PV încă.</p>'
    return t + `<p class="sfat">${SFATURI[tip] ?? ''}</p>` + SFAT_SEMNAT
  }

  function corpRegistru(lista) {
    const reg = lista.filter((d) => d.pozitie != null).sort((a, b) => a.pozitie - b.pozitie)
    const t = reg.length ? tabel([
      ['Nr. crt.', (d) => d.pozitie, 'titlu-card'], ['Nr. PV', (d) => d.nr_pv, 'titlu-card'], ['Data', (d) => dataRo(d.data_doc)],
      ['Document', (d) => esc(d.tip === 'pv_lucrari_ascunse' ? 'PV lucrări ascunse' : d.tip)],
      ['Categorie', (d) => esc(d.categorie || '')], ['Descriere', (d) => esc(d.descriere || ''), 'lat'],
      colStare, colGenerat, ['Semnat', semnat('p')],
    ], reg) : '<p class="gol">Registrul e gol. Documentele intră aici când sunt emise.</p>'
    return t + '<p class="sfat">Excelul registrului îl ceri din Claude: <q>Dă-mi registrul obiectului în Excel.</q></p>'
  }

  // Un grup întreg „în lucru” se strânge într-un rând care se deschide la atingere.
  function grupInLucru(titlu, lista) {
    return `<details class="grup-wip"><summary><span class="nume">${esc(titlu)}<small>${lista.length} ${lista.length === 1 ? 'model' : 'modele'}</small></span>${eticheta(false)}</summary>
      <div class="lista">${lista.map((t) => rand(typeof t === 'string' ? { cod: '', nume: t } : t)).join('')}</div></details>`
  }

  function deseneazaLucrarea(l, zile, docs) {
    const obiecte = [...(l.obiecte ?? [])].sort((a, b) => a.ordine - b.ordine)
    const persoane = [...(l.persoane_lucrare ?? [])].sort((a, b) => a.ordine - b.ordine)

    const totalTipuri = JURNALE.length + PV_CONSTRUCTII.length + PV_INSTALATII.length + Object.values(DOCUMENTE_LUCRARE).flat().length + 2
    const activeTipuri = JURNALE.filter((x) => x.activ).length + PV_CONSTRUCTII.filter((x) => x.activ).length + 1 // + registrul
    const nrDocs = zile.length + docs.length

    const obiecteHtml = obiecte.map((o) => {
      const aleObiectului = docs.filter((d) => d.obiect_id === o.id)
      const pvLa = aleObiectului.filter((d) => d.tip === 'pv_lucrari_ascunse')
      return `<div class="obiect">
        ${obiecte.length > 1 || l.tip === 'cu_obiecte' ? `<h3>OB. ${esc(o.cod)} — ${esc(o.nume)}</h3>` : ''}
        <section class="grup"><h2>Registrul obiectului</h2><div class="lista">
          ${rand({ cod: 'REG', nume: 'Registrul procese verbale', desc: 'ordinea documentelor din dosar' }, { activ: true, numar: aleObiectului.filter((d) => d.pozitie != null).length, corp: corpRegistru(aleObiectului) })}
        </div></section>
        <section class="grup"><h2>PV construcții <small>${PV_CONSTRUCTII.length}</small></h2><div class="lista">
          ${PV_CONSTRUCTII.map((t) => t.activ ? rand(t, { activ: true, numar: pvLa.length, corp: corpPv(pvLa, t.activ) }) : rand(t)).join('')}
        </div></section>
        <section class="grup">${grupInLucru('PV instalații', PV_INSTALATII)}</section>
      </div>`
    }).join('')

    const documenteHtml = `<div class="grupuri-wip">${Object.entries(DOCUMENTE_LUCRARE).map(([cat, lista]) => grupInLucru(cat, lista)).join('')}</div>`

    $('pagina').innerHTML = `
      <div class="antet">
        <h1>${esc(l.nume)}</h1>
        <dl>
          <div><dt>Antreprenor</dt><dd>${esc(l.antreprenor || '—')}</dd></div>
          <div><dt>Beneficiar</dt><dd>${esc(l.beneficiar || '—')}</dd></div>
          <div><dt>Șantier / obiectiv</dt><dd>${esc(l.santier_obiectiv || '—')}</dd></div>
        </dl>
        ${persoane.length ? `<div class="persoane">${persoane.map((p) => `<span>${esc(ROLURI[p.rol] ?? p.rol)}: ${esc(p.nume)}</span>`).join('')}</div>` : ''}
      </div>

      <div class="progres">
        <div class="rand"><strong>Cartea Tehnică a Construcției</strong><span>${nrDocs} ${nrDocs === 1 ? 'document generat' : 'documente generate'}</span></div>
        <div class="bara-progres" title="${activeTipuri} din ${totalTipuri} tipuri de documente disponibile"><i style="width:${Math.max(3, Math.round(activeTipuri / totalTipuri * 100))}%"></i></div>
        <div class="legenda"><span>${activeTipuri} din ${totalTipuri} tipuri de documente disponibile azi</span><span>${eticheta(true)} se face din Claude</span><span>${eticheta(false)} urmează</span></div>
      </div>

      <section class="grup"><h2>Jurnale <small>pentru toată lucrarea</small></h2><div class="lista">
        ${JURNALE.map((t) => t.activ ? rand(t, { activ: true, numar: zile.length, corp: corpJurnal(zile) }) : rand(t)).join('')}
      </div></section>

      ${obiecteHtml}

      <section class="grup"><h2>Documentele lucrării <small>${Object.values(DOCUMENTE_LUCRARE).flat().length} modele, pe categorii</small></h2></section>
      ${documenteHtml}

      <section class="grup"><h2>Dosarul complet</h2><div class="lista">
        ${rand({ cod: 'CTC', nume: 'Cartea Tehnică completă', desc: 'toate documentele, în ordinea din borderou, într-un singur fișier' })}
      </div></section>`
  }

  // ---------- Vederea unui document (de la codul QR) ----------
  // Codul: „j.” (zi de jurnal) sau „p.” (proces verbal) + UUID-ul în base64url (vezi functions/mcp/tools/qr.ts).
  function decodeaza(cod) {
    const m = String(cod).match(/^([jp])\.([A-Za-z0-9_-]{22})$/)
    if (!m) return null
    const bin = atob(m[2].replace(/-/g, '+').replace(/_/g, '/') + '==')
    const hex = [...bin].map((c) => c.charCodeAt(0).toString(16).padStart(2, '0')).join('')
    return { fel: m[1], id: `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}` }
  }

  const lista = (xs, f) => (xs ?? []).length ? `<ul>${xs.map((x) => `<li>${f(x)}</li>`).join('')}</ul>` : '<p class="gol">—</p>'

  function rezumatJurnal(z) {
    const n = (x) => Number(x) || 0
    const muncitori = (z.muncitori ?? []).reduce((s, m) => s + n(m.calificati) + n(m.necalificati), 0)
    return `
      <dl class="fise">
        <div><dt>Vremea</dt><dd>${esc(z.vremea || '—')}${z.temperatura ? `, ${esc(String(z.temperatura).replace(/\s*°?C$/i, ''))} °C` : ''}</dd></div>
        <div><dt>Program</dt><dd>${z.ora_start ? `${z.ora_start.slice(0, 5)}–${(z.ora_final || '').slice(0, 5)}` : '—'}</dd></div>
        <div><dt>Muncitori</dt><dd>${muncitori}</dd></div>
        <div><dt>Utilaje</dt><dd>${(z.utilaje ?? []).reduce((s, u) => s + n(u.numar), 0)}</dd></div>
      </dl>
      <h3>Activități</h3>${lista(z.activitati, (a) => `${esc(a.denumire)}${a.cantitate ? ` · ${esc(a.cantitate)} ${esc(a.um || '')}` : ''}`)}
      <h3>Evenimente deosebite</h3>
      <p>${[z.neconformitati, z.influente_vreme, z.propuneri].every((t) => !t || /^nu sunt$/i.test(t.trim())) ? 'NU SUNT' :
        [z.neconformitati, z.influente_vreme, z.propuneri].filter((t) => t && !/^nu sunt$/i.test(t.trim())).map(esc).join('<br>')}</p>`
  }

  function rezumatPv(d) {
    const c = d.date ?? {}
    return `
      <dl class="fise">
        <div><dt>Categorie</dt><dd>${esc(d.categorie || '—')}</dd></div>
        <div><dt>Poziție în registru</dt><dd>${d.pozitie ?? '—'}</dd></div>
      </dl>
      <h3>Faza verificată</h3><p>${esc(c.faza_lucrare || '—')}</p>
      <h3>Elemente de identificare</h3><p>${esc(c.elemente_identificare || '—')}</p>
      <h3>Concluzii</h3><p>${esc(c.concluzii || '—')}</p>`
  }

  // ---------- Varianta semnată: încărcare poze / PDF ----------
  const marime = (o) => o >= 1048576 ? `${(o / 1048576).toFixed(1).replace('.', ',')} MB` : `${Math.max(1, Math.round(o / 1024))} KB`
  const dataOraRo = (iso) => iso ? new Date(iso).toLocaleString('ro-RO', { dateStyle: 'short', timeStyle: 'short' }) : ''
  let docCurent = null // { cod, fel, id, firma_id }

  function sectiuneSemnat(d) {
    const fisiere = d.fisiere_semnate ?? []
    const poate = d.stare === 'emis' || d.stare === 'semnat'
    return `<section class="doc-card">
      <h2>Varianta semnată ${d.stare === 'semnat' ? '<span class="eticheta ok">Semnat</span>' : ''}</h2>
      ${fisiere.length ? `<ul class="fisiere">${fisiere.map((f) => `<li>
          <span class="fisier-nume">${esc(f.nume)}<small>${dataOraRo(f.incarcat_la)} · ${marime(f.marime || 0)}</small></span>
          <button class="descarca" data-cale="${esc(f.cale)}">Descarcă</button></li>`).join('')}</ul>` : ''}
      ${poate ? `${fisiere.length ? '' : `<ol class="pasi">
          <li>Tipărești documentul.</li>
          <li>Îl semnează cei din tabelul de semnături.</li>
          <li>Faci poze la toate paginile sau un PDF scanat.</li>
          <li>Le încarci aici. Documentul devine „semnat”.</li>
        </ol>`}
        <label class="incarca" for="fisiere-semnat">${fisiere.length ? '+ Adaugă pagini' : 'Încarcă poze sau PDF'}</label>
        <input id="fisiere-semnat" type="file" accept="image/*,application/pdf" multiple hidden>
        <p class="stare-incarcare" id="stare-incarcare" role="status"></p>`
      : '<p class="gol">Documentul e încă ciornă. Emite-l din Claude, tipărește-l, apoi încarcă aici varianta semnată.</p>'}
    </section>`
  }

  // Pozele de telefon (3–8 MB) se micșorează la cel mult 2400 px, JPEG: se citesc bine și ocupă puțin.
  async function pregatesteFisier(f) {
    if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 1.5 * 1048576) return { blob: f, tip: f.type, nume: f.name }
    try {
      const img = await createImageBitmap(f)
      const k = Math.min(1, 2400 / Math.max(img.width, img.height))
      const c = document.createElement('canvas')
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k)
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85))
      return { blob, tip: 'image/jpeg', nume: f.name.replace(/\.[^.]+$/, '') + '.jpg' }
    } catch {
      return { blob: f, tip: f.type, nume: f.name }
    }
  }

  async function incarcaSemnat(fisiere) {
    if (!docCurent || !fisiere.length) return
    const stareEl = $('stare-incarcare')
    const buton = document.querySelector('label.incarca')
    buton.classList.add('ocupat')
    const incarcate = []
    try {
      for (let i = 0; i < fisiere.length; i++) {
        stareEl.textContent = `Se încarcă ${i + 1} din ${fisiere.length}…`
        const { blob, tip, nume } = await pregatesteFisier(fisiere[i])
        const sigur = nume.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '-').slice(-60)
        const cale = `firme/${docCurent.firma_id}/semnat/${docCurent.fel}/${docCurent.id}/${Date.now()}-${i + 1}-${sigur}`
        const { error } = await supabase.storage.from('documente').upload(cale, blob, { contentType: tip })
        if (error) throw new Error(/mime|type/i.test(error.message) ? `„${nume}” nu e poză sau PDF.` : /size|large/i.test(error.message) ? `„${nume}” are peste 25 MB.` : error.message)
        incarcate.push({ cale, nume, tip, marime: blob.size })
      }
      stareEl.textContent = 'Se salvează…'
      const { error } = await supabase.rpc('document_adauga_semnat', { p_fel: docCurent.fel, p_id: docCurent.id, p_fisiere: incarcate })
      if (error) throw error
      await deseneazaDocument(docCurent.cod)
      $('stare-incarcare').textContent = `Gata: ${incarcate.length} ${incarcate.length === 1 ? 'fișier încărcat' : 'fișiere încărcate'}.`
    } catch (e) {
      buton.classList.remove('ocupat')
      stareEl.textContent = 'Nu s-a încărcat: ' + (e.message || e) + (incarcate.length ? ' Încearcă din nou.' : '')
      stareEl.classList.add('eroare')
    }
  }

  $('pagina').addEventListener('change', (ev) => {
    if (ev.target.id === 'fisiere-semnat') incarcaSemnat([...ev.target.files])
  })

  async function deseneazaDocument(cod) {
    $('ecran-app').querySelector('.app').classList.add('doc-vedere')
    const dec = decodeaza(cod)
    if (!dec) { $('pagina').innerHTML = '<p class="eroare">Codul QR nu e valid. Scanează-l din nou.</p>'; return }
    $('pagina').innerHTML = '<p style="color:var(--muted)">Se încarcă documentul…</p>'
    const tabelDoc = dec.fel === 'j' ? 'jurnal_zile' : 'documente'
    const coloane = dec.fel === 'j'
      ? '*, lucrari ( id, nume, antreprenor, beneficiar, santier_obiectiv )'
      : '*, lucrari ( id, nume, antreprenor, beneficiar, santier_obiectiv ), obiecte ( cod, nume )'
    const { data: d, error } = await supabase.from(tabelDoc).select(coloane).eq('id', dec.id).maybeSingle()
    if (error || !d) {
      $('pagina').innerHTML = `<div class="doc-card"><h1>Documentul nu e disponibil</h1>
        <p>Nu există sau contul <strong>${esc($('utilizator').textContent)}</strong> nu are acces la el. Dacă e documentul altei firme, intră cu contul de acolo.</p>
        <p><a href="./">Vezi lucrările tale</a></p></div>`
      return
    }
    const l = d.lucrari ?? {}
    docCurent = { cod, fel: dec.fel, id: d.id, firma_id: d.firma_id }
    const eJurnal = dec.fel === 'j'
    const titlu = eJurnal
      ? `Jurnal de șantier nr. ${d.nr}`
      : `PV lucrări ascunse${d.nr_pv ? ` nr. ${d.nr_pv}` : ''}`
    const data = dataRo(eJurnal ? d.data : d.data_doc)

    $('pagina').innerHTML = `
      <p class="inapoi"><a href="./#${esc(l.id)}">← Cartea Tehnică · ${esc(l.nume)}</a></p>
      <div class="doc-card">
        <div class="doc-tip">${eJurnal ? 'Zi din jurnalul de șantier' : 'Proces verbal'}${!eJurnal && d.obiecte ? ` · OB. ${esc(d.obiecte.cod)}` : ''}</div>
        <h1>${esc(titlu)}</h1>
        <div class="doc-meta">${stare(d.stare)}<span>${data}</span>${d.versiune > 1 ? `<span>versiunea ${d.versiune}</span>` : ''}</div>
        <dl class="fise">
          <div><dt>Lucrarea</dt><dd>${esc(l.nume)}</dd></div>
          <div><dt>Beneficiar</dt><dd>${esc(l.beneficiar || '—')}</dd></div>
        </dl>
      </div>

      <section class="doc-card">
        <h2>Documentul generat</h2>
        ${d.fisier_docx ? `<p>${descarca(d.fisier_docx)}</p>` : '<p class="gol">E încă ciornă. Se generează la emitere, din Claude.</p>'}
      </section>

      ${sectiuneSemnat(d)}

      <section class="doc-card">
        <h2>Pe scurt</h2>
        ${eJurnal ? rezumatJurnal(d) : rezumatPv(d)}
      </section>`
  }

  $('pagina').addEventListener('click', async (ev) => {
    const cap = ev.target.closest('.tip-cap[aria-expanded]')
    if (cap) {
      const deschis = cap.getAttribute('aria-expanded') === 'true'
      cap.setAttribute('aria-expanded', String(!deschis))
      cap.nextElementSibling.hidden = deschis
      return
    }
    const b = ev.target.closest('.descarca')
    if (b) {
      b.disabled = true
      const { data, error } = await supabase.storage.from('documente').createSignedUrl(b.dataset.cale, 120, { download: b.dataset.cale.split('/').pop() })
      b.disabled = false
      if (error) { b.textContent = 'Eroare'; return }
      location.href = data.signedUrl
    }
  })

  porneste()
</script>
</body>
</html>
